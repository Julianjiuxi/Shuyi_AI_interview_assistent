<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>述忆 · 传记访谈</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <!-- =============== 最左侧：任务栏 =============== -->
    <aside class="rail">

      <div class="rail-top">
        <div class="rail-brand">
          <span class="brand-logo">述</span>
          <span class="brand-name">述忆</span>
          <svg class="rail-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>

        <ul class="rail-menu">
          <li class="rail-menu-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>新对话</span>
            <button id="new-chat-btn" class="rail-menu-action" title="新建访谈">+</button>
          </li>
        </ul>
      </div>

      <div class="rail-middle">
        <div class="rail-section-title">访谈项目</div>
        <div class="rail-section-action" id="add-person-btn">+ 创建新访谈</div>

        <div class="rail-section-title">最近</div>
        <ul id="person-list" class="person-list"></ul>
      </div>

      <div class="rail-bottom">
        <div class="user-card">
          <div class="user-avatar">U</div>
          <div class="user-meta">
            <div class="user-name">用户</div>
            <div class="user-plan">本地服务</div>
          </div>
          <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
    </aside>

    <!-- =============== 中间主区 =============== -->
    <main class="main">

      <!-- 顶部条 -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="copy-session-btn" class="tb-icon-btn" title="复制对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
        <div class="topbar-center">
          <span id="project-badge" class="project-badge">述忆 · AI 传记访谈</span>
          <span class="tip-note">AI 生成内容，请注意核实</span>
        </div>
        <div class="topbar-right"></div>
      </header>

      <!-- 对话流 -->
      <div id="chat-stream" class="chat-stream">
        <div id="chat-empty" class="chat-empty">
          <div class="empty-title">开启一场关于生命的访谈</div>
          <div class="empty-hint">选择或新建一位讲述人，AI 将陪你记录人生。</div>
        </div>
      </div>

      <!-- 底部输入卡片 -->
      <div class="composer-wrap">
        <div class="composer-card">
          <div class="composer-tools">
            <button id="more-btn" class="tool-btn" title="更多功能">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <div id="more-menu" class="more-menu hidden">
              <div class="more-item" id="summarize-btn">
                <span class="mi-title">总结人生</span>
                <span class="mi-desc">根据已有记忆生成传记总结</span>
              </div>
            </div>
          </div>

          <textarea id="input" class="composer-input" rows="1" placeholder="发消息或按 Enter 发送…（Shift + Enter 换行）"></textarea>

          <div class="composer-actions">
            <!-- 留空，未来可加模型切换 -->
            <span></span>

            <!-- 语音输入：预留接口，未来接入语音转文字（STT） -->
            <button id="voice-in-btn" class="circle-btn" title="语音输入（即将支持）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
                <path d="M19 11a7 7 0 0 1-14 0"/>
                <line x1="12" y1="18" x2="12" y2="22"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 添加人物弹窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>创建新访谈</h2>
      <input id="modal-name" type="text" placeholder="讲述人姓名，如：陈建国" autocomplete="off" />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-ghost">取消</button>
        <button id="modal-ok" class="btn-primary">开始访谈</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
