<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ShuYi · 电话模式 Demo</title>
<style>
  :root {
    --paper: #fbf3e3;
    --paper-2: #f5ecdd;
    --ink: #3f2d22;
    --ink-soft: #7a614f;
    --accent: #a4522d;
    --accent-2: #c8753c;
    --bg-soft: rgba(245, 236, 221, 0.92);
    --danger: #b33a3a;
    --green: #3f8e55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  .page { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; gap: 24px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: 2px; }
  .sub { color: var(--ink-soft); max-width: 680px; line-height: 1.7; text-align: center; font-size: 14px; }
  .chat { width: min(720px, 100%); border: 1px solid #e7d6b8; background: #fffaf0; border-radius: 16px; padding: 16px; min-height: 160px; }
  .input-wrap { width: min(720px, 100%); display: flex; gap: 8px; align-items: center; border: 1px solid #e7d6b8; border-radius: 999px; background: #fffaf0; padding: 6px 6px 6px 18px; }
  .input-wrap input { flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; color: var(--ink); padding: 10px 0; }
  .btn { border: 0; cursor: pointer; border-radius: 999px; padding: 10px 16px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-send { background: var(--accent); color: #fff; }
  .btn-phone { background: var(--green); color: #fff; }
  .btn-phone:hover { background: #367948; }
  .call-mask { position: fixed; inset: 0; background: var(--bg-soft); backdrop-filter: blur(6px); display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 48px 24px 40px; z-index: 50; }
  .call-mask.on { display: flex; }
  .call-top { text-align: center; }
  .call-title { font-size: 15px; color: var(--ink-soft); letter-spacing: 2px; }
  .call-subject { font-size: 21px; margin-top: 10px; }
  .call-timer { margin-top: 6px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .hp-hint { margin-top: 8px; font-size: 12px; color: #a78365; opacity: 0.85; letter-spacing: 0.5px; }
  .waveform { width: min(560px, 100%); height: 150px; display: block; }
  .transcript { width: min(720px, 100%); display: flex; flex-direction: column; gap: 10px; max-height: 34vh; overflow: auto; padding: 4px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; font-size: 14px; word-break: break-word; }
  .me { align-self: flex-end; background: #f2dfc2; border-bottom-right-radius: 4px; color: #5b3f2a; }
  .ai { align-self: flex-start; background: #fff; border: 1px solid #e7d6b8; border-bottom-left-radius: 4px; color: var(--ink); }
  .bubble.provisional { opacity: 0.7; }
  .call-bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .status { font-size: 13px; color: var(--ink-soft); min-height: 18px; }
  .hangup { background: var(--danger); color: #fff; padding: 15px 26px; border-radius: 999px; border: 0; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(179,58,58,0.25); }
  .hangup:hover { background: #9f3030; }
  .error-note { color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; width: min(720px, 100%); }
</style>
</head>
<body>
<div class="page">
  <h1>ShuYi · 书忆 电话访谈 Demo</h1>
  <p class="sub">点击下方绿色「开始通话」，进入与 ShuYi AI 访谈员的实时语音通话。谈话规则已对齐 RT 模式纯文字聊天：<b>不做问卷，承接讲述者，轻轻深挖。</b></p>

  <div id="chat" class="chat">
    <div class="bubble ai"><b>访谈员：</b>您好，请点击下方「🎧 开始通话」。通话时请允许麦克风权限，结束后再点红色挂断。</div>
  </div>

  <div class="input-wrap">
    <input id="msgInput" placeholder="这里只是占位，真正的沟通请用上面的电话。" disabled />
    <button class="btn btn-phone" id="btnCall" type="button">🎧 开始通话</button>
    <button class="btn btn-send" disabled type="button">发送</button>
  </div>
  <div class="error-note" id="errNote"></div>
</div>

<div class="call-mask" id="callMask">
  <div class="call-top">
    <div class="call-title">正在与 ShuYi AI 访谈员通话 · 口述历史模式</div>
    <div class="call-subject">林美珍 · 1945 · 山东临沂</div>
    <div class="call-timer" id="timer">00:00</div>
    <div class="hp-hint">🎧 建议戴上耳机，可完全消除扬声器回声</div>
  </div>

  <canvas class="waveform" id="wave"></canvas>

  <div class="transcript" id="transcript"></div>

  <div class="call-bottom">
    <div class="status" id="status">正在连接…</div>
    <button class="hangup" id="btnHangup" type="button">📞 挂断</button>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const btnCall = $('#btnCall');
const btnHangup = $('#btnHangup');
const mask = $('#callMask');
const canvas = $('#wave');
const ctx = canvas.getContext('2d');
const transcriptEl = $('#transcript');
const statusEl = $('#status');
const errNote = $('#errNote');
const timerEl = $('#timer');

let ws = null;
let mediaStream = null;
let audioCtx = null;
let workletNode = null;
let analyser = null;
let rafId = null;
let timerId = null;
let startTs = 0;
let provisionalUserText = '';
let provisionalAiText = '';
let provisionalUserBubble = null;
let aiBubble = null;
let audioDeltaQueue = [];
let ttsActive = false;
let _ttsCooldownTimer = null;
const TTS_COOLDOWN_MS = 1200;
let _currentTtsChunks = [];

/* ============ 画布自适应 ============ */
function fitCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}
window.addEventListener('resize', fitCanvas);

/* ============ 计时器 ============ */
function startTimer() {
  startTs = Date.now();
  timerEl.textContent = '00:00';
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - startTs) / 1000);
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${ss}`;
  }, 500);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* ============ 波形（基于 AnalyserNode） ============ */
function drawWave() {
  if (!analyser) return;
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  const bars = 48;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  ctx.clearRect(0, 0, w, h);
  const step = Math.floor(data.length / bars);
  const barW = (w / bars) * 0.55;
  const gap = (w / bars) * 0.45;
  for (let i = 0; i < bars; i++) {
    const v = (data[i * step] || 0) / 255;
    const bh = Math.max(4, v * h * 0.9);
    const x = i * (barW + gap) + gap / 2;
    const y = (h - bh) / 2;
    const grad = ctx.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0, '#c8753c');
    grad.addColorStop(1, '#a4522d');
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, barW, bh, barW / 2);
    ctx.fill();
  }
  rafId = requestAnimationFrame(drawWave);
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ============ 字幕 ============ */
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setError(msg) { errNote.textContent = msg || ''; }
function setStatus(msg) { statusEl.textContent = msg || ''; }

function updateUserBubble() {
  if (!provisionalUserBubble) {
    provisionalUserBubble = document.createElement('div');
    provisionalUserBubble.className = 'bubble me provisional';
    transcriptEl.appendChild(provisionalUserBubble);
  }
  provisionalUserBubble.innerHTML = '<b>您：</b> ' + escapeHtml(provisionalUserText || '(…)');
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}
function _collapseReps(text) {
  return String(text)
    .replace(/([\u4e00-\u9fa5A-Za-z0-9，。！？、,.!?；：;:]{2,16})\1{3,}/g, '$1')
    .replace(/([\u4e00-\u9fa5A-Za-z0-9])\1{5,}/g, '$1$1$1');
}
function finalizeUserBubble() {
  if (provisionalUserBubble) {
    provisionalUserBubble.classList.remove('provisional');
    const cleaned = _collapseReps(provisionalUserText);
    provisionalUserBubble.innerHTML = '<b>您：</b> ' + escapeHtml(cleaned);
    if (!cleaned.trim()) { provisionalUserBubble.remove(); }
  }
  provisionalUserBubble = null;
  provisionalUserText = '';
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}
function updateAiBubble() {
  if (!aiBubble) {
    aiBubble = document.createElement('div');
    aiBubble.className = 'bubble ai';
    transcriptEl.appendChild(aiBubble);
  }
  aiBubble.innerHTML = '<b>访谈员：</b> ' + escapeHtml(provisionalAiText || '(…)');
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}
function finalizeAiBubble() {
  aiBubble = null;
  provisionalAiText = '';
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

/* ============ 音频播放（OGG-Opus） ============ */
/**
 * Seeduplex 返回 response.output_audio.delta 是流式 OGG 分片：
 * 通常只有第一片带 OggS/OpusHead 头，后续是 continuation page。
 * 必须等 output_audio.done（音频全部到齐）再 concat 成完整 OGG 播放，
 * 否则会播到一半就"只剩前几个字"。输出文本的 output_text.done 可能早于音频
 * 分片到齐，所以绝不能拿它当 flush 信号。
 */
function enqueueAudioFromBase64(b64) {
  const bytes = base64ToBytes(b64);
  _currentTtsChunks.push(bytes);
}
function _startsWithOggS(bytes) {
  return bytes.length >= 4 && bytes[0] === 0x4F && bytes[1] === 0x67 && bytes[2] === 0x67 && bytes[3] === 0x53;
}
function _containsOpusHead(bytes) {
  const needle = [0x4F, 0x70, 0x75, 0x73, 0x48, 0x65, 0x61, 0x64]; // "OpusHead"
  const limit = Math.min(bytes.length - 8, 256);
  for (let i = 0; i <= limit; i++) {
    let ok = true;
    for (let j = 0; j < 8; j++) { if (bytes[i + j] !== needle[j]) { ok = false; break; } }
    if (ok) return true;
  }
  return false;
}
async function flushCurrentTtsToPlayback() {
  if (!_currentTtsChunks.length) return;
  const chunks = _currentTtsChunks;
  _currentTtsChunks = [];

  // 统计有多少片自带 OpusHead：若几乎每片都是完整 OGG，则逐片播放；否则按流式切片 concat。
  let headCount = 0;
  for (const c of chunks) if (_containsOpusHead(c)) headCount++;
  const allFull = headCount > 0 && headCount >= chunks.length - 1;

  if (allFull) {
    for (const c of chunks) {
      audioDeltaQueue.push(new Blob([c], { type: 'audio/ogg; codecs=opus' }));
    }
  } else {
    const total = chunks.reduce((s, c) => s + c.length, 0);
    const merged = new Uint8Array(total);
    let pos = 0;
    for (const c of chunks) { merged.set(c, pos); pos += c.length; }
    audioDeltaQueue.push(new Blob([merged], { type: 'audio/ogg; codecs=opus' }));
  }
  await pumpAudio();
}
function _setTtsActive(v) {
  ttsActive = v;
  if (_ttsCooldownTimer) { clearTimeout(_ttsCooldownTimer); _ttsCooldownTimer = null; }
  if (!v) {
    _ttsCooldownTimer = setTimeout(() => { ttsActive = false; }, TTS_COOLDOWN_MS);
  }
}
async function pumpAudio() {
  if (window._playing) return;
  while (audioDeltaQueue.length) {
    const blob = audioDeltaQueue.shift();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    window._playing = true;
    _setTtsActive(true);
    await new Promise((res) => {
      audio.onended = res;
      audio.onerror = () => { URL.revokeObjectURL(url); res(); };
      audio.play().catch(() => res());
    });
    URL.revokeObjectURL(url);
    window._playing = false;
  }
  _setTtsActive(false);
}

/* ============ Base64 工具 ============ */
function bytesToBase64(bytes) {
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
function base64ToBytes(b64) {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* ============ AudioWorklet：48k -> 16k 重采样 + Int16，每 20ms 出一包 ============ */
const WORKLET_CODE = `
class PCM16Processor extends AudioWorkletProcessor {
  constructor() {
    super();
    this._outRate = 16000;
    this._ratio = sampleRate / this._outRate;
    this._acc = new Float32Array(0);
    this._chunk = new Int16Array(320);
    this._chunkPos = 0;
  }
  _resample(samples) {
    const merged = new Float32Array(this._acc.length + samples.length);
    merged.set(this._acc, 0);
    merged.set(samples, this._acc.length);
    const outLen = Math.floor(merged.length / this._ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const pos = i * this._ratio;
      const i0 = Math.floor(pos);
      const i1 = Math.min(i0 + 1, merged.length - 1);
      const frac = pos - i0;
      out[i] = merged[i0] * (1 - frac) + merged[i1] * frac;
    }
    const consumed = Math.floor(outLen * this._ratio);
    this._acc = merged.slice(consumed);
    return out;
  }
  process(inputs) {
    const input = inputs[0];
    if (input && input[0]) {
      const resampled = this._resample(input[0]);
      for (let i = 0; i < resampled.length; i++) {
        let v = Math.max(-1, Math.min(1, resampled[i]));
        this._chunk[this._chunkPos++] = v < 0 ? v * 0x8000 : v * 0x7fff;
        if (this._chunkPos === 320) {
          const pcm = this._chunk.slice().buffer;
          this.port.postMessage(pcm, [pcm]);
          this._chunkPos = 0;
          this._chunk = new Int16Array(320);
        }
      }
    }
    return true;
  }
}
registerProcessor('pcm16-processor', PCM16Processor);
`;

/* ============ 下行事件处理 ============ */
async function handleDownEvent(obj) {
  const t = obj.type || '';
  // ASR 流式 / 完成：delta 是累计 partial，直接覆盖；AI 播放期间丢弃（声学回声抑制）
  if (t === 'conversation.item.input_audio_transcription.delta') {
    if (ttsActive) return;
    const d = obj.delta || obj.text || '';
    if (d) { provisionalUserText = d; updateUserBubble(); }
    return;
  }
  if (t === 'conversation.item.input_audio_transcription.completed') {
    if (ttsActive) return;
    const d = obj.delta || obj.text || '';
    if (d) provisionalUserText = d;
    if (provisionalUserText) finalizeUserBubble();
    return;
  }
  // Chat 流式 delta：真·增量 token，逐条累加（与 ASR 语义相反）
  if (t === 'response.output_text.delta') {
    const d = obj.delta || obj.text || '';
    if (d) { provisionalAiText += d; updateAiBubble(); }
    return;
  }
  if (t === 'response.output_text.done') {
    if (provisionalAiText) finalizeAiBubble();
    // 注意：不要在这里 flush 音频。output_text.done 可能早于音频分片到齐，
    // 提前 flush 会把不完整的 OGG 播出来（只剩前几个字）。
    return;
  }
  // TTS 音频增量：分片进入缓冲，等到 .done 再合并成完整 OGG Blob 播放
  if (t === 'response.output_audio.delta') {
    const d = obj.delta || obj.audio || '';
    if (d) enqueueAudioFromBase64(d);
    return;
  }
  if (t === 'response.output_audio.done') {
    await flushCurrentTtsToPlayback();
    return;
  }
  // 会话 / 错误
  if (t === 'session.created') { setStatus('会话已就绪，请开始说话…'); return; }
  if (t === 'error') {
    setError('服务端错误：' + (obj.detail || obj.message || JSON.stringify(obj)));
    setStatus('出错');
    return;
  }
  if (t === 'response.done') {
    await flushCurrentTtsToPlayback();
    return;
  }
  // 其它：若有文本则尝试作为 AI 文本展示
  const text = obj.delta || obj.text || obj.content;
  if (typeof text === 'string' && text) {
    provisionalAiText += text; updateAiBubble();
  }
}

/* ============ 主流程 ============ */
btnCall.addEventListener('click', startCall);
btnHangup.addEventListener('click', endCall);

let _micHintTimer = null;

async function startCall() {
  setError('');
  setStatus('请求麦克风…');
  mask.classList.add('on');
  fitCanvas();

  // 提前绑定断开按钮可用（即使用户还没给权限也能取消）
  btnHangup.disabled = false;

  // 5 秒后若仍在等待授权，给用户一个明确的提示（最常见情况是浏览器弹窗躲在遮罩后面了）
  if (_micHintTimer) clearTimeout(_micHintTimer);
  _micHintTimer = setTimeout(() => {
    if (!mediaStream) {
      setStatus('仍在等麦克风授权…');
      setError('请在浏览器地址栏左侧的小弹窗里点击「允许」使用麦克风，或检查系统输入设备。若已拒绝请点击地址栏锁图标重新授权后刷新页面。');
    }
  }, 5000);

  // 先做安全上下文/接口检查，尽早报错，不要永远卡在 getUserMedia 上
  const HOST_IS_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'https:';
  if (!HOST_IS_LOCAL) {
    cleanup();
    setError('当前域名不受信。请用 http://127.0.0.1:8765 或 https 访问（getUserMedia 仅在安全上下文可用）。');
    setStatus('失败');
    return;
  }
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    cleanup();
    setError('当前浏览器不支持 getUserMedia 接口。请用最新版 Chrome / Edge。');
    setStatus('失败');
    return;
  }

  // 1. 麦克风（带 25 秒超时 + 可中断）
  let micTimer = null;
  try {
    const micPromise = navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
    const timeoutPromise = new Promise((_, rej) => {
        micTimer = setTimeout(() => rej(new Error('麦克风请求超时超过 25s 未获得授权')), 25000);
    });
    mediaStream = await Promise.race([micPromise, timeoutPromise]);
    clearTimeout(micTimer);
    if (_micHintTimer) { clearTimeout(_micHintTimer); _micHintTimer = null; }
    setError('');
  } catch (e) {
    clearTimeout(micTimer);
    if (_micHintTimer) { clearTimeout(_micHintTimer); _micHintTimer = null; }
    // 常见错误友好化
    const name = (e && e.name) || '';
    const msg = (e && e.message) || String(e);
    let friendly = '无法获取麦克风：' + msg;
    if (/NotAllowed|PermissionDenied/.test(name)) {
      friendly = '麦克风权限被拒绝。请点击浏览器地址栏左侧的"锁"或"麦克风"图标，把本站改成"允许"，然后刷新页面。';
    } else if (/NotFound|DevicesNotFound|Overconstrained/.test(name)) {
      friendly = '系统找不到可用的麦克风输入设备。请先在系统设置里检查麦克风是否插好并已启用。';
    } else if (/NotReadable|TrackStart/.test(name)) {
      friendly = '麦克风被其他应用占用（比如系统录音机、视频会议等），请关掉后再试。';
    }
    setError(friendly);
    setStatus('失败');
    mask.classList.remove('on');
    return;
  }

  // 2. AudioContext + AudioWorklet + Analyser
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(mediaStream);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);

    const blob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
    const workletUrl = URL.createObjectURL(blob);
    setStatus('初始化音频采集…');
    await audioCtx.audioWorklet.addModule(workletUrl);
    workletNode = new AudioWorkletNode(audioCtx, 'pcm16-processor');
    src.connect(workletNode);
    // 收到 20ms PCM16 -> Base64 -> input_audio_buffer.append
    workletNode.port.onmessage = (e) => {
      const pcm16 = new Uint8Array(e.data);
      const b64 = bytesToBase64(pcm16);
      sendJson({ type: 'input_audio_buffer.append', audio: b64 });
    };
  } catch (e) {
    cleanup();
    setError('音频初始化失败：' + (e.message || String(e)));
    setStatus('失败');
    return;
  }

  // 3. 连接本地中继
  setStatus('连接语音服务…');
  try {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/call`);
  } catch (e) {
    cleanup();
    setError('建立 WebSocket 失败：' + (e.message || String(e)));
    setStatus('失败');
    return;
  }

  ws.addEventListener('open', () => {
    setStatus('会话初始化中…');
    startTimer();
    rafId = requestAnimationFrame(drawWave);
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  ws.addEventListener('message', (ev) => {
    if (typeof ev.data === 'string') {
      let obj;
      try { obj = JSON.parse(ev.data); } catch { return; }
      handleDownEvent(obj).catch((err) => { console.error('[handleDownEvent]', err); });
    }
  });

  ws.addEventListener('close', () => {
    setStatus('连接已关闭');
    if (mask.classList.contains('on') && ws) endCall();
  });
  ws.addEventListener('error', () => {
    setError('WebSocket 发生错误（后端未启动或网络问题）。');
    setStatus('失败');
  });
}

function sendJson(obj) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify(obj));
  }
}

function endCall() {
  // 优雅关闭：先 session.close，等 session.closed 后再断链
  if (ws && ws.readyState === 1) {
    sendJson({ type: 'session.close' });
    setTimeout(() => { try { ws.close(); } catch {} }, 300);
  }
  cleanup();
}

function cleanup() {
  try { if (ws) ws.close(); } catch {}
  ws = null;
  if (workletNode) { try { workletNode.port.onmessage = null; workletNode.disconnect(); } catch {} }
  workletNode = null;
  if (analyser) { try { analyser.disconnect(); } catch {} }
  analyser = null;
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (audioCtx) { try { audioCtx.close(); } catch {} audioCtx = null; }
  stopTimer();
  audioDeltaQueue = [];
  provisionalUserText = '';
  provisionalAiText = '';
  provisionalUserBubble = null;
  aiBubble = null;
  mask.classList.remove('on');
  setStatus('');
}
</script>
</body>
</html>
